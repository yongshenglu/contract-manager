# 合同到期与付款提醒
#
# 页面仓库是公开的，合同数据在私有仓库 contract-manager-data 里。
# 这里通过 DATA_TOKEN 跨仓库读数据、回写提醒发送记录。
# 注意：Actions 日志在公开仓库下所有人可见，所以脚本里的邮箱一律打码。
name: 合同提醒

on:
  schedule:
    # 每 4 小时一个时点（共 6 个），配合下面「只在 UTC 00:00-03:59 发信」的闸门。
    #
    # 为什么要这么密：实测 GitHub 定时器在这个仓库上不准点 ——
    #   11-25 配置 01:17 UTC → 09:48 实际；11-26 同配置 → 09:29 实际；
    #   11-27 改成每 10 分钟一次，2.5 小时内一次都没触发。
    # 时点间隔 4 小时 = 窗口宽度 4 小时，所以不管实际偏移是多少，
    # 每天必然恰好有一次落在窗口内，不会漏发。
    # 偏移为 0 或 +8h 时，命中的正是 UTC 01:30 = 北京 09:30。
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      simulate_date:
        description: '模拟日期 YYYY-MM-DD（留空 = 今天）'
        required: false
        default: ''
      dry_run:
        description: '只打印不发信'
        type: boolean
        default: false

# 页面仓库只读：数据的写入走 DATA_TOKEN 作用在私有仓库上
permissions:
  contents: read

concurrency:
  group: contract-remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 跨仓库访问私有数据仓库
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      DATA_OWNER: ${{ vars.DATA_OWNER }}
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_BRANCH: ${{ vars.DATA_BRANCH }}
      DATA_CONTRACTS_PATH: ${{ vars.DATA_CONTRACTS_PATH }}
      DATA_LOG_PATH: ${{ vars.DATA_LOG_PATH }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # 数据不在本仓库，先从私有数据仓库拉下来
      - name: 拉取私有数据仓库的合同数据
        run: node scripts/data-io.js fetch

      # 数据格式错误时在这里就失败，避免静默漏发
      - name: 校验合同数据
        run: node scripts/check.js --dry-run --all

      - name: 运行核心规则测试
        run: node scripts/test.js

      - name: 运行前端冒烟测试
        run: node scripts/ui-test.js

      - name: 计算并发送提醒
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
          SIMULATE_DATE: ${{ github.event.inputs.simulate_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          # 定时触发时，只在 UTC 00:00-03:59（北京 08:00-11:59）真正发信。
          # 其余时点的运行会走到这里但直接跳过，避免下午/夜里发邮件。
          # 手动 workflow_dispatch 不受限制（测试、模拟日期都能正常跑）。
          if [ "$EVENT_NAME" = "schedule" ]; then
            H=$(date -u +%H)
            H=${H#0}
            case "$H" in
              0|1|2|3) ;;
              *) echo "跳过发信：当前 UTC ${H} 点，不在发送时段（UTC 00:00-03:59 = 北京 08:00-11:59）"; exit 0 ;;
            esac
          fi

          ARGS=""
          if [ -n "$SIMULATE_DATE" ]; then ARGS="$ARGS --date $SIMULATE_DATE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "参数:${ARGS:-（默认：用今天、真实发送）}"
          node scripts/check.js $ARGS

      # 把提醒记录写回【私有数据仓库】—— 不写本仓库，公开日志里也不会留合同信息
      - name: 回写提醒发送记录
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node scripts/data-io.js push-log
